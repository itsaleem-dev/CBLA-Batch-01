<!DOCTYPE html>

    <title>43 Table Caption</title>
</head>
<body>
    <h1>Table Caption</h1>
    <table border="1">
        <caption>Student Marks</caption>
        <tr><th>Name</th><th>Marks</th></tr>
        <tr><td>Ali</td><td>90</td></tr>
    </table>
</body>
