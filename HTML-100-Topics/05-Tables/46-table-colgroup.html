<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>46 Table Colgroup</title>
</head>
<body>
    <h1>Colgroup</h1>
    <table border="1">
        <colgroup>
            <col span="1">
            <col span="1">
        </colgroup>
        <tr><th>Name</th><th>Marks</th></tr>
        <tr><td>Ali</td><td>95</td></tr>
    </table>
</body>
</html>
