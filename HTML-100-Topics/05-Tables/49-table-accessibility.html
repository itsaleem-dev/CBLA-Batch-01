<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>49 Table Accessibility</title>
</head>
<body>
    <h1>Accessible Table</h1>
    <table border="1">
        <caption>Course Students</caption>
        <thead>
            <tr><th scope="col">Student</th><th scope="col">Course</th></tr>
        </thead>
        <tbody>
            <tr><th scope="row">Ali</th><td>HTML</td></tr>
            <tr><th scope="row">Ahmed</th><td>CSS</td></tr>
        </tbody>
    </table>
</body>
</html>
