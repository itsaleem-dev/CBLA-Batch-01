<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>48 Table Complete Example</title>
</head>
<body>
    <h1>Complete Table</h1>
    <table border="1">
        <caption>Student Result</caption>
        <thead>
            <tr><th>Name</th><th>HTML</th><th>CSS</th><th>Total</th></tr>
        </thead>
        <tbody>
            <tr><td>Ali</td><td>90</td><td>85</td><td>175</td></tr>
            <tr><td>Ahmed</td><td>80</td><td>88</td><td>168</td></tr>
        </tbody>
        <tfoot>
            <tr><th colspan="3">Class Total</th><th>343</th></tr>
        </tfoot>
    </table>
</body>
</html>
