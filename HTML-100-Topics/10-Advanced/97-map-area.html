<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>97 Map Area</title>
</head>
<body>
    <h1>Image Map and Area</h1>
    <img src="https://via.placeholder.com/500x200" alt="Clickable Map" usemap="#website-map">
    <map name="website-map">
        <area shape="rect" coords="0,0,250,200" href="https://www.google.com" alt="Google">
        <area shape="rect" coords="250,0,500,200" href="https://www.wikipedia.org" alt="Wikipedia">
    </map>
</body>
</html>
