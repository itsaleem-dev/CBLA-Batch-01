<!DOCTYPE html>

<body>
    <h1>Select Optgroup</h1>
    <select>
        <optgroup label="Frontend">
            <option>HTML</option>
            <option>CSS</option>
        </optgroup>
        <optgroup label="Programming">
            <option>JavaScript</option>
            <option>Python</option>
        </optgroup>
    </select>
