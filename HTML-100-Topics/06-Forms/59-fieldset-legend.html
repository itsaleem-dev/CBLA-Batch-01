<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>59 Fieldset Legend</title>
</head>
<body>
    <h1>Fieldset and Legend</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label>Name:</label>
            <input type="text">
            <label>Email:</label>
            <input type="email">
        </fieldset>
    </form>
</body>
</html>
