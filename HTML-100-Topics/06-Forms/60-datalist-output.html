<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60 Datalist Output</title>
</head>
<body>
    <h1>Datalist and Output</h1>
    <label for="browser">Choose a browser:</label>
    <input list="browsers" id="browser">
    <datalist id="browsers">
        <option value="Chrome">
        <option value="Firefox">
        <option value="Edge">
    </datalist>
    <p>Selected value: <output>Chrome</output></p>
</body>
</html>
