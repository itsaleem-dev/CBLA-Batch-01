<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pseudo Classes</h1>
        <p class="lead">Pseudo-classes style elements based on state or position: hover, active, focus, nth-child, first-child, last-child and not.</p>
    </header>
    <main>
        <button class="btn">Hover or press me</button>
        <input class="field" type="text" placeholder="Click to focus">
        <ul class="list">
            <li>First child</li>
            <li>Second item</li>
            <li>Third item</li>
            <li>Fourth item</li>
            <li>Last child</li>
        </ul>
    </main>
</body>
</html>
