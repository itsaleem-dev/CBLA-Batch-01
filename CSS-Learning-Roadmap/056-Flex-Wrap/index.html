<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Wrap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Flex Wrap</h1>
        <p class="lead">flex-wrap controls whether items stay on one line or wrap onto new lines.</p>
    </header>
    <main>
        <h3>nowrap (items overflow, scroll sideways)</h3>
        <div class="flex nowrap">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
        <h3>wrap</h3>
        <div class="flex wrap">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
        <h3>wrap-reverse</h3>
        <div class="flex wrap-reverse">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </main>
</body>
</html>
