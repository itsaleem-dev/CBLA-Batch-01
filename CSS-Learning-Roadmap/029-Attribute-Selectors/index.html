<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Attribute Selectors</h1>
        <p class="lead">Attribute selectors match elements by their attributes and values.</p>
    </header>
    <main>
        <ul class="links">
            <li><a href="https://example.com" target="_blank">External link</a></li>
            <li><a href="guide.pdf">PDF download</a></li>
            <li><a href="#top">Internal link</a></li>
            <li><a href="mailto:hello@example.com">Email link</a></li>
        </ul>
        <form class="demo"><input type="text" placeholder="type=text"><input type="email" placeholder="type=email"><input type="password" placeholder="type=password"><input type="submit" value="type=submit"></form>
        <p class="btn-primary" data-status="done">data-status="done" and class contains btn</p>
        <p data-status="pending">data-status="pending"</p>
    </main>
</body>
</html>
