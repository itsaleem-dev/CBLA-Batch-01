<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Animations</h1>
        <p class="lead">CSS animations run automatically using the animation properties: duration, timing, iteration, direction and delay.</p>
    </header>
    <main>
        <div class="demo">
            <figure>
                <div class="shape spin"></div>
                <figcaption>spin</figcaption>
            </figure>
            <figure>
                <div class="shape pulse"></div>
                <figcaption>pulse</figcaption>
            </figure>
            <figure>
                <div class="shape bounce"></div>
                <figcaption>bounce</figcaption>
            </figure>
            <figure>
                <div class="shape fade"></div>
                <figcaption>fade (delay 1s)</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
