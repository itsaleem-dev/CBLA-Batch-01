<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Grid Template</h1>
        <p class="lead">The grid-template shorthand and named grid lines.</p>
    </header>
    <main>
        <h3>grid-template shorthand with areas</h3>
        <div class="short">
            <div class="box a">a (wide)</div>
            <div class="box b">b</div>
            <div class="box c">c</div>
        </div>
        <h3>Named lines: full-start, content-start, content-end, full-end</h3>
        <div class="named">
            <div class="box full">full</div>
            <div class="box left">left</div>
            <div class="box content">content</div>
            <div class="box right">right</div>
        </div>
    </main>
</body>
</html>
