<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Box Model</h1>
        <p class="lead">The box model: content, padding, border and margin. Compare content-box with border-box.</p>
    </header>
    <main>
        <div class="models">
            <div class="model content-box">
                <p>content-box</p>
                <p>200px + 40px padding + 20px border = 260px wide</p>
            </div>
            <div class="model border-box">
                <p>border-box</p>
                <p>200px in total, padding and border included</p>
            </div>
        </div>
    </main>
</body>
</html>
