<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Buttons</h1>
        <p class="lead">Button styles: variants, sizes, states, a button group and a pill button.</p>
    </header>
    <main>
        <div class="row">
            <button class="btn primary">Primary</button>
            <button class="btn outline">Outline</button>
            <button class="btn danger">Danger</button>
            <button class="btn pill">Pill</button>
            <button class="btn primary" disabled>Disabled</button>
        </div>
        <div class="row">
            <button class="btn primary small">Small</button>
            <button class="btn primary">Medium</button>
            <button class="btn primary large">Large</button>
        </div>
        <div class="group">
            <button>Left</button>
            <button>Middle</button>
            <button>Right</button>
        </div>
    </main>
</body>
</html>
