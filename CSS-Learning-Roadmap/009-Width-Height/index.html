<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width Height</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Width Height</h1>
        <p class="lead">Width and height set the size of elements using fixed, relative and limited values.</p>
    </header>
    <main>
        <div class="w fixed">width: 300px</div>
        <div class="w half">width: 50%</div>
        <div class="w full">width: 100%</div>
        <div class="w maxed">width: 100%; max-width: 400px</div>
        <div class="w tall">width: 200px; height: 120px</div>
        <div class="w min">min-height: 80px; width: 60%</div>
    </main>
</body>
</html>
