<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Gradient</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Linear Gradient</h1>
        <p class="lead">linear-gradient() with directions, angles, multiple stops and hard stops.</p>
    </header>
    <main>
        <div class="grid">
            <div class="g g1">to right</div>
            <div class="g g2">45deg, 3 colors</div>
            <div class="g g3">color stop positions</div>
            <div class="g g4">hard stops (flag)</div>
            <div class="g g5">repeating stripes</div>
            <div class="g g6">fade to transparent</div>
        </div>
    </main>
</body>
</html>
