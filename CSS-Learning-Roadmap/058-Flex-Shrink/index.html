<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Shrink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Flex Shrink</h1>
        <p class="lead">flex-shrink decides how items shrink when the container is too small. Items are 250px wide in a 500px container.</p>
    </header>
    <main>
        <div class="flex">
            <div class="box s1">shrink: 1</div>
            <div class="box s0">shrink: 0</div>
            <div class="box s3">shrink: 3</div>
        </div>
    </main>
</body>
</html>
