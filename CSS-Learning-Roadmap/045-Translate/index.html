<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Translate</h1>
        <p class="lead">translate() moves an element without affecting the layout. Dashed boxes show the original positions.</p>
    </header>
    <main>
        <div class="row">
            <div class="slot">
                <div class="item x">translateX(40px)</div>
            </div>
            <div class="slot">
                <div class="item y">translateY(-20px)</div>
            </div>
            <div class="slot">
                <div class="item xy">translate(30px, 20px)</div>
            </div>
        </div>
        <div class="center-wrap">
            <div class="centered">translate(-50%, -50%)</div>
        </div>
    </main>
</body>
</html>
