<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Scale</h1>
        <p class="lead">scale() resizes an element. The last card zooms its inner content on hover.</p>
    </header>
    <main>
        <div class="row">
            <div class="s">scale(0.7)</div>
            <div class="s big">scale(1.3)</div>
            <div class="s sx">scaleX(2)</div>
            <div class="s sy">scaleY(0.5)</div>
        </div>
        <div class="zoom">
            <div class="inner">Hover to zoom</div>
        </div>
    </main>
</body>
</html>
