<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backdrop Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Backdrop Filter</h1>
        <p class="lead">backdrop-filter blurs whatever is behind an element, creating a frosted glass effect.</p>
    </header>
    <main>
        <div class="stage">
            <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
            <div class="glass">
                <h2>Frosted glass</h2>
                <p>The colorful shapes behind this card are blurred by backdrop-filter.</p>
            </div>
        </div>
    </main>
</body>
</html>
