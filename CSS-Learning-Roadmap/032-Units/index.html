<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Units</h1>
        <p class="lead">CSS units: px, em, rem, percent, vw, vh and ch.</p>
    </header>
    <main>
        <div class="bar px">200px</div>
        <div class="bar em">12em</div>
        <div class="bar rem">12rem</div>
        <div class="bar pct">50%</div>
        <div class="bar vw">30vw</div>
        <div class="bar ch">30ch</div>
        <div class="bar vh">60% wide, 10vh tall</div>
    </main>
</body>
</html>
