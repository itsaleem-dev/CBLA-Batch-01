<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tables</h1>
        <p class="lead">Table styling: collapsed borders, striped rows, hover highlight and a styled header.</p>
    </header>
    <main>
        <table>
            <caption>Weekly study plan</caption>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Topic</th>
                    <th>Hours</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Monday</td>
                    <td>Selectors</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>Tuesday</td>
                    <td>Box model</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td>Wednesday</td>
                    <td>Flexbox</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>Thursday</td>
                    <td>Grid</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td>Friday</td>
                    <td>Animations</td>
                    <td>1</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">Total</td>
                    <td>11</td>
                </tr>
            </tfoot>
        </table>
    </main>
</body>
</html>
