<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Items</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Align Items</h1>
        <p class="lead">align-items aligns items along the cross axis. The boxes have different font sizes so baseline is visible.</p>
    </header>
    <main>
        <h3>align-items: flex-start</h3>
        <div class="flex flex-start">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>align-items: center</h3>
        <div class="flex center">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>align-items: flex-end</h3>
        <div class="flex flex-end">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>align-items: stretch</h3>
        <div class="flex stretch">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>align-items: baseline</h3>
        <div class="flex baseline">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </main>
</body>
</html>
