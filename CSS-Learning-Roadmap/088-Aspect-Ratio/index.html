<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspect Ratio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Aspect Ratio</h1>
        <p class="lead">aspect-ratio keeps a box in proportion as its width changes.</p>
    </header>
    <main>
        <div class="grid">
            <div class="r r169">16 / 9</div>
            <div class="r r11">1 / 1</div>
            <div class="r r43">4 / 3</div>
            <div class="r r219">21 / 9</div>
            <div class="r r916">9 / 16</div>
        </div>
        <div class="video">
            <div class="screen">Responsive video box (16 / 9)</div>
        </div>
    </main>
</body>
</html>
