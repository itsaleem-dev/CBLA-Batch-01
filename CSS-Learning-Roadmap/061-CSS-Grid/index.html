<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Grid</h1>
        <p class="lead">CSS Grid places items into rows and columns. This gallery uses a three-column grid and one wide item.</p>
    </header>
    <main>
        <div class="gallery">
            <div class="item wide">Wide item (span 2)</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item tall">Tall item (span 2 rows)</div>
            <div class="item">6</div>
            <div class="item">7</div>
            <div class="item">8</div>
        </div>
    </main>
</body>
</html>
