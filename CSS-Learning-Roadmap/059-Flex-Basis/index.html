<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Basis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Flex Basis</h1>
        <p class="lead">flex-basis sets the starting size of an item before growing or shrinking.</p>
    </header>
    <main>
        <h3>Row: flex-basis in px and %</h3>
        <div class="flex">
            <div class="box b100">100px</div>
            <div class="box b200">200px</div>
            <div class="box b30">30%</div>
        </div>
        <h3>Column: flex-basis sets the height</h3>
        <div class="flex tall">
            <div class="box h60">60px</div>
            <div class="box h100">100px</div>
        </div>
    </main>
</body>
</html>
