<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gradients</h1>
        <p class="lead">Gradients are generated images: linear, radial, conic and repeating.</p>
    </header>
    <main>
        <div class="grid">
            <div class="g linear">linear-gradient</div>
            <div class="g radial">radial-gradient</div>
            <div class="g conic">conic-gradient</div>
            <div class="g repeating">repeating-linear-gradient</div>
        </div>
    </main>
</body>
</html>
