<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margins</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Margins</h1>
        <p class="lead">Margin adds space outside an element, pushing neighbors away.</p>
    </header>
    <main>
        <div class="stage">
            <div class="item m-none">margin: 0</div>
            <div class="item m-small">margin: 10px</div>
            <div class="item m-large">margin: 40px</div>
            <div class="item m-sides">margin: 10px 0 10px 80px</div>
            <div class="item m-auto">width: 200px; margin: 20px auto</div>
        </div>
    </main>
</body>
</html>
