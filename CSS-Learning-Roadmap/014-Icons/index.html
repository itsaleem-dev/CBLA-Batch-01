<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Icons</h1>
        <p class="lead">Icons drawn with pure CSS using borders and pseudo-elements, no images needed.</p>
    </header>
    <main>
        <div class="icons">
            <div class="cell">
                <span class="icon-menu"></span>
                <p>Menu</p>
            </div>
            <div class="cell">
                <span class="icon-close"></span>
                <p>Close</p>
            </div>
            <div class="cell">
                <span class="icon-arrow"></span>
                <p>Arrow</p>
            </div>
            <div class="cell">
                <span class="icon-heart"></span>
                <p>Heart</p>
            </div>
            <div class="cell">
                <span class="icon-check"></span>
                <p>Check</p>
            </div>
        </div>
    </main>
</body>
</html>
