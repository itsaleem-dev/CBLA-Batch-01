<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Rotate</h1>
        <p class="lead">rotate() turns an element around its origin. Hover over the boxes to see transitions.</p>
    </header>
    <main>
        <div class="row">
            <div class="r r1">15deg</div>
            <div class="r r2">-30deg</div>
            <div class="r r3">180deg</div>
            <div class="r r4">rotateY</div>
            <div class="r r5">origin: top left</div>
            <div class="r r6">hover: 360deg</div>
        </div>
    </main>
</body>
</html>
