<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Flexbox</h1>
        <p class="lead">Flexbox lays out items in a row or column. This page uses it for a toolbar and a row of cards.</p>
    </header>
    <main>
        <div class="toolbar">
            <strong class="logo">FlexSite</strong><a href="#">Home</a><a href="#">Articles</a><a href="#">About</a>
            <button class="cta">Subscribe</button>
        </div>
        <div class="cards">
            <div class="card">
                <h3>Fast</h3>
                <p>Items share space automatically.</p>
            </div>
            <div class="card">
                <h3>Flexible</h3>
                <p>Items grow, shrink and wrap.</p>
            </div>
            <div class="card">
                <h3>Aligned</h3>
                <p>Center things in one line of CSS.</p>
            </div>
        </div>
    </main>
</body>
</html>
