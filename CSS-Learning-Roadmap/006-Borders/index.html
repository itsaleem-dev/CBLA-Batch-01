<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Borders</h1>
        <p class="lead">Borders can change style, width, color, individual sides and corner radius.</p>
    </header>
    <main>
        <div class="row">
            <div class="b solid">solid</div>
            <div class="b dashed">dashed</div>
            <div class="b dotted">dotted</div>
            <div class="b double">double</div>
            <div class="b groove">groove</div>
            <div class="b sides">single sides</div>
            <div class="b round">radius</div>
            <div class="b circle">50%</div>
        </div>
    </main>
</body>
</html>
