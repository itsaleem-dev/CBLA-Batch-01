<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Padding</h1>
        <p class="lead">Padding adds space inside an element, between its content and its border.</p>
    </header>
    <main>
        <div class="row">
            <div class="p p0">padding: 0</div>
            <div class="p p1">padding: 10px</div>
            <div class="p p2">padding: 30px</div>
            <div class="p p3">padding: 10px 40px</div>
        </div>
    </main>
</body>
</html>
