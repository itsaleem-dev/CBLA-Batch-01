<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gap</h1>
        <p class="lead">gap adds space between flex items without margins. Compare gap, column-gap and row-gap.</p>
    </header>
    <main>
        <h3>gap: 1rem</h3>
        <div class="flex g1">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
        <h3>row-gap: 0.25rem; column-gap: 2rem</h3>
        <div class="flex g2">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
        <h3>gap: 2rem 0.5rem</h3>
        <div class="flex g3">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </main>
</body>
</html>
