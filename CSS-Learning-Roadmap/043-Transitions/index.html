<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Transitions</h1>
        <p class="lead">Transitions animate a change smoothly. Hover over each track and compare the timing functions.</p>
    </header>
    <main>
        <div class="track">
            <div class="ball">linear</div>
        </div>
        <div class="track">
            <div class="ball ease">ease</div>
        </div>
        <div class="track">
            <div class="ball in">ease-in</div>
        </div>
        <div class="track">
            <div class="ball out">ease-out</div>
        </div>
        <button class="btn">Hover me</button>
    </main>
</body>
</html>
