<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Position</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Object Position</h1>
        <p class="lead">object-position moves a cropped image inside its box. All images use object-fit: cover.</p>
    </header>
    <main>
        <div class="gallery">
            <figure>
                <img class="p0" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='450'%20viewBox='0%200%20800%20450'%3E%3Crect%20width='800'%20height='450'%20fill='%236366f1'/%3E%3Ccircle%20cx='160'%20cy='225'%20r='135'%20fill='%23fbbf24'/%3E%3Crect%20x='560'%20y='90'%20width='160'%20height='270'%20fill='%23ffffff'/%3E%3Cpolygon%20points='320%2C382%20400%2C135%20480%2C382'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>object-position: left</figcaption>
            </figure>
            <figure>
                <img class="p1" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='450'%20viewBox='0%200%20800%20450'%3E%3Crect%20width='800'%20height='450'%20fill='%236366f1'/%3E%3Ccircle%20cx='160'%20cy='225'%20r='135'%20fill='%23fbbf24'/%3E%3Crect%20x='560'%20y='90'%20width='160'%20height='270'%20fill='%23ffffff'/%3E%3Cpolygon%20points='320%2C382%20400%2C135%20480%2C382'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>object-position: center</figcaption>
            </figure>
            <figure>
                <img class="p2" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='450'%20viewBox='0%200%20800%20450'%3E%3Crect%20width='800'%20height='450'%20fill='%236366f1'/%3E%3Ccircle%20cx='160'%20cy='225'%20r='135'%20fill='%23fbbf24'/%3E%3Crect%20x='560'%20y='90'%20width='160'%20height='270'%20fill='%23ffffff'/%3E%3Cpolygon%20points='320%2C382%20400%2C135%20480%2C382'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>object-position: right</figcaption>
            </figure>
            <figure>
                <img class="p3" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='450'%20viewBox='0%200%20800%20450'%3E%3Crect%20width='800'%20height='450'%20fill='%236366f1'/%3E%3Ccircle%20cx='160'%20cy='225'%20r='135'%20fill='%23fbbf24'/%3E%3Crect%20x='560'%20y='90'%20width='160'%20height='270'%20fill='%23ffffff'/%3E%3Cpolygon%20points='320%2C382%20400%2C135%20480%2C382'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>object-position: 80% 50%</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
