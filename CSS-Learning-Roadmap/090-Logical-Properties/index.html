<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical Properties</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Logical Properties</h1>
        <p class="lead">Logical properties follow the writing direction, so the same CSS works for left-to-right and right-to-left text.</p>
    </header>
    <main>
        <div class="panel" dir="ltr">
            <p class="note">dir="ltr": the accent border is on the left</p>
        </div>
        <div class="panel" dir="rtl">
            <p class="note">dir="rtl": the same CSS puts the border on the right</p>
        </div>
    </main>
</body>
</html>
