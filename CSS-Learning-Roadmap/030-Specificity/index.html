<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specificity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Specificity</h1>
        <p class="lead">Specificity decides which rule wins when several rules target the same element.</p>
    </header>
    <main>
        <p>1. Element selector: blue</p>
        <p class="rule-class">2. A class beats an element: green</p>
        <p class="rule-class" id="rule-id">3. An ID beats a class: red</p>
        <div class="wrap">
            <p class="rule-class">4. Two classes beat one class: orange</p>
        </div>
        <p class="rule-class" style="color:#7c3aed">5. An inline style beats a class: purple</p>
    </main>
</body>
</html>
