<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile First</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mobile First</h1>
        <p class="lead">Mobile-first CSS starts with the small-screen layout and adds min-width queries for larger screens.</p>
    </header>
    <main>
        <div class="label"></div>
        <div class="grid">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </main>
</body>
</html>
