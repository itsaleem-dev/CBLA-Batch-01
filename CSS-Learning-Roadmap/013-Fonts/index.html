<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Fonts</h1>
        <p class="lead">Font properties choose the typeface, size, weight and style.</p>
    </header>
    <main>
        <p class="serif">Serif: Georgia</p>
        <p class="sans">Sans-serif: Arial</p>
        <p class="mono">Monospace: Courier New</p>
        <p class="big">font-size: 2rem</p>
        <p class="bold">font-weight: 700</p>
        <p class="light">font-weight: 300</p>
        <p class="italic">font-style: italic</p>
        <p class="caps">font-variant: small-caps</p>
    </main>
</body>
</html>
