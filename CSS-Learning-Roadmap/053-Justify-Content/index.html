<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify Content</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Justify Content</h1>
        <p class="lead">justify-content aligns items along the main axis.</p>
    </header>
    <main>
        <h3>justify-content: flex-start</h3>
        <div class="flex flex-start">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>justify-content: center</h3>
        <div class="flex center">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>justify-content: flex-end</h3>
        <div class="flex flex-end">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>justify-content: space-between</h3>
        <div class="flex space-between">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>justify-content: space-around</h3>
        <div class="flex space-around">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>justify-content: space-evenly</h3>
        <div class="flex space-evenly">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </main>
</body>
</html>
