<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skew</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Skew</h1>
        <p class="lead">skew() slants an element along the X or Y axis. Counter-skew the text to keep it straight.</p>
    </header>
    <main>
        <div class="row">
            <div class="k kx">skewX(-20deg)</div>
            <div class="k ky">skewY(10deg)</div>
            <div class="k kxy">skew(-15deg, 5deg)</div>
        </div>
        <a class="skew-btn" href="#"><span>Straight text</span></a>
    </main>
</body>
</html>
