<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Transparency</h1>
        <p class="lead">Transparent colors fade only the background, while opacity fades everything inside.</p>
    </header>
    <main>
        <div class="bg">
            <div class="t rgba">rgba background: the text stays solid</div>
            <div class="t op">opacity: the text fades too</div>
            <div class="t keyword">background: transparent</div>
            <div class="t hsla">hsl with alpha</div>
        </div>
    </main>
</body>
</html>
