<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Important</h1>
        <p class="lead">!important overrides normal specificity. Use it rarely because it makes CSS harder to maintain.</p>
    </header>
    <main>
        <p id="one" class="forced">This ID rule says red, but !important on the class makes it green.</p>
        <p id="two">This ID rule has no !important, so it stays red.</p>
    </main>
</body>
</html>
