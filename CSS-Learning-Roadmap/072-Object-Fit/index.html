<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Fit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Object Fit</h1>
        <p class="lead">object-fit decides how an image fills a fixed-size box.</p>
    </header>
    <main>
        <div class="gallery">
            <figure>
                <img class="fill" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='450'%20viewBox='0%200%20800%20450'%3E%3Crect%20width='800'%20height='450'%20fill='%236366f1'/%3E%3Ccircle%20cx='160'%20cy='225'%20r='135'%20fill='%23fbbf24'/%3E%3Crect%20x='560'%20y='90'%20width='160'%20height='270'%20fill='%23ffffff'/%3E%3Cpolygon%20points='320%2C382%20400%2C135%20480%2C382'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>object-fit: fill</figcaption>
            </figure>
            <figure>
                <img class="contain" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='450'%20viewBox='0%200%20800%20450'%3E%3Crect%20width='800'%20height='450'%20fill='%236366f1'/%3E%3Ccircle%20cx='160'%20cy='225'%20r='135'%20fill='%23fbbf24'/%3E%3Crect%20x='560'%20y='90'%20width='160'%20height='270'%20fill='%23ffffff'/%3E%3Cpolygon%20points='320%2C382%20400%2C135%20480%2C382'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>object-fit: contain</figcaption>
            </figure>
            <figure>
                <img class="cover" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='450'%20viewBox='0%200%20800%20450'%3E%3Crect%20width='800'%20height='450'%20fill='%236366f1'/%3E%3Ccircle%20cx='160'%20cy='225'%20r='135'%20fill='%23fbbf24'/%3E%3Crect%20x='560'%20y='90'%20width='160'%20height='270'%20fill='%23ffffff'/%3E%3Cpolygon%20points='320%2C382%20400%2C135%20480%2C382'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>object-fit: cover</figcaption>
            </figure>
            <figure>
                <img class="none" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='450'%20viewBox='0%200%20800%20450'%3E%3Crect%20width='800'%20height='450'%20fill='%236366f1'/%3E%3Ccircle%20cx='160'%20cy='225'%20r='135'%20fill='%23fbbf24'/%3E%3Crect%20x='560'%20y='90'%20width='160'%20height='270'%20fill='%23ffffff'/%3E%3Cpolygon%20points='320%2C382%20400%2C135%20480%2C382'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>object-fit: none</figcaption>
            </figure>
            <figure>
                <img class="scale-down" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='450'%20viewBox='0%200%20800%20450'%3E%3Crect%20width='800'%20height='450'%20fill='%236366f1'/%3E%3Ccircle%20cx='160'%20cy='225'%20r='135'%20fill='%23fbbf24'/%3E%3Crect%20x='560'%20y='90'%20width='160'%20height='270'%20fill='%23ffffff'/%3E%3Cpolygon%20points='320%2C382%20400%2C135%20480%2C382'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>object-fit: scale-down</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
