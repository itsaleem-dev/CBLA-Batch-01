<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Selectors</h1>
        <p class="lead">Selectors choose which elements a rule applies to.</p>
    </header>
    <main>
        <h2 id="main-title">ID selector heading</h2>
        <p>A plain paragraph styled by the element selector.</p>
        <p class="highlight">This paragraph uses a class selector.</p>
        <h3>Group selector heading</h3>
        <div class="universal"><span>Universal selector</span><em>inside this box</em></div>
    </main>
</body>
</html>
