<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Filters Effects</h1>
        <p class="lead">Filter effects: combined filters, drop-shadow, vintage looks and a hover gallery that turns gray images to color.</p>
    </header>
    <main>
        <h3>Combined filters</h3>
        <div class="row">
            <img class="vintage" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='260'%20viewBox='0%200%20400%20260'%3E%3Crect%20width='400'%20height='260'%20fill='%230ea5e9'/%3E%3Ccircle%20cx='80'%20cy='130'%20r='78'%20fill='%23f59e0b'/%3E%3Crect%20x='280'%20y='52'%20width='80'%20height='156'%20fill='%23ffffff'/%3E%3Cpolygon%20points='160%2C221%20200%2C78%20240%2C221'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Vintage styled illustration">
            <img class="dim" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='260'%20viewBox='0%200%20400%20260'%3E%3Crect%20width='400'%20height='260'%20fill='%230ea5e9'/%3E%3Ccircle%20cx='80'%20cy='130'%20r='78'%20fill='%23f59e0b'/%3E%3Crect%20x='280'%20y='52'%20width='80'%20height='156'%20fill='%23ffffff'/%3E%3Cpolygon%20points='160%2C221%20200%2C78%20240%2C221'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Dimmed illustration">
        </div>
        <h3>drop-shadow on a shape</h3>
        <div class="row">
            <div class="logo"></div>
            <div class="logo glow"></div>
        </div>
        <h3>Hover gallery</h3>
        <div class="row gallery">
            <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='260'%20viewBox='0%200%20400%20260'%3E%3Crect%20width='400'%20height='260'%20fill='%23ec4899'/%3E%3Ccircle%20cx='80'%20cy='130'%20r='78'%20fill='%23fde047'/%3E%3Crect%20x='280'%20y='52'%20width='80'%20height='156'%20fill='%23ffffff'/%3E%3Cpolygon%20points='160%2C221%20200%2C78%20240%2C221'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Gallery image one">
            <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='260'%20viewBox='0%200%20400%20260'%3E%3Crect%20width='400'%20height='260'%20fill='%2310b981'/%3E%3Ccircle%20cx='80'%20cy='130'%20r='78'%20fill='%23f43f5e'/%3E%3Crect%20x='280'%20y='52'%20width='80'%20height='156'%20fill='%23ffffff'/%3E%3Cpolygon%20points='160%2C221%20200%2C78%20240%2C221'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Gallery image two">
            <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='260'%20viewBox='0%200%20400%20260'%3E%3Crect%20width='400'%20height='260'%20fill='%236366f1'/%3E%3Ccircle%20cx='80'%20cy='130'%20r='78'%20fill='%2322d3ee'/%3E%3Crect%20x='280'%20y='52'%20width='80'%20height='156'%20fill='%23ffffff'/%3E%3Cpolygon%20points='160%2C221%20200%2C78%20240%2C221'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Gallery image three">
        </div>
    </main>

</html>
