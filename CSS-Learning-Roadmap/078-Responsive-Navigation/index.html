<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Responsive Navigation</h1>
        <p class="lead">A responsive navigation that becomes a hamburger menu under 700px, built with a checkbox and no JavaScript.</p>
    </header>
    <main>
        <header class="site">
            <a class="brand" href="#">Brand</a><input type="checkbox" id="menu-toggle" class="toggle">
            <label for="menu-toggle" class="burger" aria-label="Toggle menu"><span></span></label>
            <nav class="menu"><a href="#">Home</a><a href="#">Products</a><a href="#">Pricing</a><a href="#">Contact</a></nav>
        </header>
        <p>Make the window narrower than 700px, then click the hamburger icon.</p>
    </main>
</body>
</html>
