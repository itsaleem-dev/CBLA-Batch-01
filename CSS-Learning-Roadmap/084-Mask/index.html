<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mask</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mask</h1>
        <p class="lead">mask-image hides parts of an element using gradients: a fade-out, a spotlight and stripes.</p>
    </header>
    <main>
        <div class="grid">
            <div class="m fade">Fade out at the bottom</div>
            <div class="m spot">Spotlight</div>
            <div class="m stripes">Stripes</div>
        </div>
    </main>
</body>
</html>
