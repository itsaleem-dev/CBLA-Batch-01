<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Display</h1>
        <p class="lead">The display property decides how an element takes part in the layout.</p>
    </header>
    <main>
        <div class="block">display: block (full width)</div>
        <div class="block">display: block (new line)</div>
        <span class="inline">inline</span><span class="inline">inline</span>
        <div class="wrap"><span class="ib">inline-block</span><span class="ib">inline-block</span></div>
        <p>This paragraph is visible.</p>
        <p class="hidden">This paragraph has display: none.</p>
        <p>The hidden paragraph above takes no space at all.</p>
    </main>
</body>
</html>
