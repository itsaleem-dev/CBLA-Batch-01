<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cursor</h1>
        <p class="lead">The cursor property changes the mouse pointer. Move the mouse over each tile.</p>
    </header>
    <main>
        <div class="grid">
            <div class="tile c-pointer">pointer</div>
            <div class="tile c-not-allowed">not-allowed</div>
            <div class="tile c-grab">grab</div>
            <div class="tile c-zoom-in">zoom-in</div>
            <div class="tile c-wait">wait</div>
            <div class="tile c-text">text</div>
            <div class="tile c-crosshair">crosshair</div>
            <div class="tile c-help">help</div>
            <div class="tile c-move">move</div>
            <div class="tile c-progress">progress</div>
        </div>
    </main>
</body>
</html>
