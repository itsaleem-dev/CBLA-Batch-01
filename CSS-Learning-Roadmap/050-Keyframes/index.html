<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Keyframes</h1>
        <p class="lead">@keyframes defines the steps of an animation: a moving box, a traffic light and a loading bar.</p>
    </header>
    <main>
        <div class="arena">
            <div class="runner"></div>
        </div>
        <div class="lights">
            <div class="lamp red"></div>
            <div class="lamp yellow"></div>
            <div class="lamp green"></div>
        </div>
        <div class="loader">
            <div class="fill"></div>
        </div>
    </main>
</body>
</html>
