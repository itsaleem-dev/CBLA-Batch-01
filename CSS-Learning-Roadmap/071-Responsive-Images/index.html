<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Responsive Images</h1>
        <p class="lead">Responsive images scale with their container. The picture element loads a different image on wide screens.</p>
    </header>
    <main>
        <h3>max-width: 100%; height: auto</h3>
        <img class="fluid" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='1200'%20height='500'%20viewBox='0%200%201200%20500'%3E%3Crect%20width='1200'%20height='500'%20fill='%236366f1'/%3E%3Ccircle%20cx='240'%20cy='250'%20r='150'%20fill='%23fbbf24'/%3E%3Crect%20x='840'%20y='100'%20width='240'%20height='300'%20fill='%23ffffff'/%3E%3Cpolygon%20points='480%2C425%20600%2C150%20720%2C425'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Wide abstract illustration">
        <h3>picture: square image on small screens, wide image from 700px</h3>
        <picture>
            <source media="(min-width: 700px)" srcset="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='1200'%20height='500'%20viewBox='0%200%201200%20500'%3E%3Crect%20width='1200'%20height='500'%20fill='%230ea5e9'/%3E%3Ccircle%20cx='240'%20cy='250'%20r='150'%20fill='%23f43f5e'/%3E%3Crect%20x='840'%20y='100'%20width='240'%20height='300'%20fill='%23ffffff'/%3E%3Cpolygon%20points='480%2C425%20600%2C150%20720%2C425'%20fill='%2322c55e'/%3E%3C/svg%3E">
            <img class="fluid" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='600'%20height='600'%20viewBox='0%200%20600%20600'%3E%3Crect%20width='600'%20height='600'%20fill='%2310b981'/%3E%3Ccircle%20cx='120'%20cy='300'%20r='180'%20fill='%23f59e0b'/%3E%3Crect%20x='420'%20y='120'%20width='120'%20height='360'%20fill='%23ffffff'/%3E%3Cpolygon%20points='240%2C510%20300%2C180%20360%2C510'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Abstract illustration that changes with screen width">
        </picture>
    </main>
</body>
</html>
