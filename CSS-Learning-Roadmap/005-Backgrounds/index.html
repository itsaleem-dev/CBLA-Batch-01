<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backgrounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Backgrounds</h1>
        <p class="lead">Background properties set colors, images, repeating, size and position.</p>
    </header>
    <main>
        <div class="grid">
            <div class="tile bg-color">background-color</div>
            <div class="tile bg-repeat">background-repeat</div>
            <div class="tile bg-single">no-repeat + position</div>
            <div class="tile bg-gradient">background-size: cover</div>
        </div>
    </main>
</body>
</html>
