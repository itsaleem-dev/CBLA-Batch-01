<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Direction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Flex Direction</h1>
        <p class="lead">flex-direction sets the main axis: row, row-reverse, column or column-reverse.</p>
    </header>
    <main>
        <h3>flex-direction: row</h3>
        <div class="flex row">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>flex-direction: row-reverse</h3>
        <div class="flex row-reverse">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>flex-direction: column</h3>
        <div class="flex column">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
        <h3>flex-direction: column-reverse</h3>
        <div class="flex column-reverse">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </main>
</body>
</html>
