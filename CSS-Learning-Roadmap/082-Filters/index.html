<!DOCTYPE html>

<head>

    <title>Filters</title>
    <link rel="stylesheet" href="style.css">

<body>
    <header>
        <h1>Filters</h1>
        <p class="lead">The filter property applies graphic effects to an element, such as blur, grayscale and sepia.</p>
    </header>
    <main>
        <div class="gallery">

                <figcaption>none</figcaption>
            </figure>
            <figure>
                <img class="f1" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='260'%20viewBox='0%200%20400%20260'%3E%3Crect%20width='400'%20height='260'%20fill='%233b82f6'/%3E%3Ccircle%20cx='80'%20cy='130'%20r='78'%20fill='%23f43f5e'/%3E%3Crect%20x='280'%20y='52'%20width='80'%20height='156'%20fill='%23ffffff'/%3E%3Cpolygon%20points='160%2C221%20200%2C78%20240%2C221'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">

            </figure>
            <figure>
                <img class="f2" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='260'%20viewBox='0%200%20400%20260'%3E%3Crect%20width='400'%20height='260'%20fill='%233b82f6'/%3E%3Ccircle%20cx='80'%20cy='130'%20r='78'%20fill='%23f43f5e'/%3E%3Crect%20x='280'%20y='52'%20width='80'%20height='156'%20fill='%23ffffff'/%3E%3Cpolygon%20points='160%2C221%20200%2C78%20240%2C221'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">

                <figcaption>hue-rotate(120deg)</figcaption>
            </figure>
            <figure>
                <img class="f7" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='260'%20viewBox='0%200%20400%20260'%3E%3Crect%20width='400'%20height='260'%20fill='%233b82f6'/%3E%3Ccircle%20cx='80'%20cy='130'%20r='78'%20fill='%23f43f5e'/%3E%3Crect%20x='280'%20y='52'%20width='80'%20height='156'%20fill='%23ffffff'/%3E%3Cpolygon%20points='160%2C221%20200%2C78%20240%2C221'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
                <figcaption>saturate(3)</figcaption>
            </figure>
            <figure>
                <img class="f8" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='400'%20height='260'%20viewBox='0%200%20400%20260'%3E%3Crect%20width='400'%20height='260'%20fill='%233b82f6'/%3E%3Ccircle%20cx='80'%20cy='130'%20r='78'%20fill='%23f43f5e'/%3E%3Crect%20x='280'%20y='52'%20width='80'%20height='156'%20fill='%23ffffff'/%3E%3Cpolygon%20points='160%2C221%20200%2C78%20240%2C221'%20fill='%2322c55e'/%3E%3C/svg%3E" alt="Sample illustration">
