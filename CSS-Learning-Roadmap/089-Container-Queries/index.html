<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Queries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Container Queries</h1>
        <p class="lead">Container queries style a component based on its container width. Drag the bottom-right corner of the dashed box.</p>
    </header>
    <main>
        <div class="wrap">
            <article class="card">
                <div class="thumb"></div>
                <div class="info">
                    <h3>Container query card</h3>
                    <p>This card switches from a stacked layout to a side-by-side layout when its container is at least 420px wide.</p>
                    <a class="btn" href="#">Details</a>
                </div>
            </article>
        </div>
    </main>
</body>
</html>
