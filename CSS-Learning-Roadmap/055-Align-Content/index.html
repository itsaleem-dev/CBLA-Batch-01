<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Content</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Align Content</h1>
        <p class="lead">align-content spreads wrapped lines of flex items across the cross axis. It needs flex-wrap and extra height.</p>
    </header>
    <main>
        <div class="grid">
            <div>
                <h3>flex-start</h3>
                <div class="flex flex-start">
                    <div class="box">1</div>
                    <div class="box">2</div>
                    <div class="box">3</div>
                    <div class="box">4</div>
                </div>
            </div>
            <div>
                <h3>center</h3>
                <div class="flex center">
                    <div class="box">1</div>
                    <div class="box">2</div>
                    <div class="box">3</div>
                    <div class="box">4</div>
                </div>
            </div>
            <div>
                <h3>flex-end</h3>
                <div class="flex flex-end">
                    <div class="box">1</div>
                    <div class="box">2</div>
                    <div class="box">3</div>
                    <div class="box">4</div>
                </div>
            </div>
            <div>
                <h3>space-between</h3>
                <div class="flex space-between">
                    <div class="box">1</div>
                    <div class="box">2</div>
                    <div class="box">3</div>
                    <div class="box">4</div>
                </div>
            </div>
            <div>
                <h3>space-around</h3>
                <div class="flex space-around">
                    <div class="box">1</div>
                    <div class="box">2</div>
                    <div class="box">3</div>
                    <div class="box">4</div>
                </div>
            </div>
            <div>
                <h3>stretch</h3>
                <div class="flex stretch">
                    <div class="box">1</div>
                    <div class="box">2</div>
                    <div class="box">3</div>
                    <div class="box">4</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
