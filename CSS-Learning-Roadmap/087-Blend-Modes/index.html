<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blend Modes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Blend Modes</h1>
        <p class="lead">Blend modes mix colors with what is behind them: mix-blend-mode on shapes and background-blend-mode on backgrounds.</p>
    </header>
    <main>
        <div class="grid">
            <div class="cell">
                <span class="blob multiply"></span>
                <p>mix-blend-mode: multiply</p>
            </div>
            <div class="cell">
                <span class="blob screen"></span>
                <p>mix-blend-mode: screen</p>
            </div>
            <div class="cell">
                <span class="blob overlay"></span>
                <p>mix-blend-mode: overlay</p>
            </div>
            <div class="cell">
                <span class="blob difference"></span>
                <p>mix-blend-mode: difference</p>
            </div>
        </div>
        <div class="bbm">background-blend-mode: multiply</div>
    </main>
</body>
</html>
