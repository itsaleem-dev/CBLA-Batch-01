<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Opacity</h1>
        <p class="lead">Opacity makes the whole element, including its text, more transparent. Hover to restore it.</p>
    </header>
    <main>
        <div class="row">
            <div class="o o1">opacity: 1</div>
            <div class="o o2">opacity: 0.7</div>
            <div class="o o3">opacity: 0.4</div>
            <div class="o o4">opacity: 0.1</div>
        </div>
    </main>
</body>
</html>
