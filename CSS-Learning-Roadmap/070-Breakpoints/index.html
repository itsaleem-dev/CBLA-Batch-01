<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakpoints</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Breakpoints</h1>
        <p class="lead">Breakpoints are the widths where the layout changes. This page uses 576px, 768px, 992px and 1200px.</p>
    </header>
    <main>
        <ul class="legend">
            <li>XS: below 576px (1 column)</li>
            <li>SM: 576px and up (2 columns)</li>
            <li>MD: 768px and up (3 columns)</li>
            <li>LG: 992px and up (4 columns)</li>
            <li>XL: 1200px and up (6 columns)</li>
        </ul>
        <div class="badge"></div>
        <div class="grid">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </main>
</body>
</html>
