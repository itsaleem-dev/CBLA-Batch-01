<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Box Shadow</h1>
        <p class="lead">box-shadow values: offset, blur, spread, color, inset and multiple layers.</p>
    </header>
    <main>
        <div class="grid">
            <div class="s soft">soft</div>
            <div class="s hard">hard offset</div>
            <div class="s spread">spread</div>
            <div class="s inset">inset</div>
            <div class="s layered">layered</div>
            <div class="s glow">glow</div>
            <div class="s lift">hover to lift</div>
        </div>
    </main>
</body>
</html>
