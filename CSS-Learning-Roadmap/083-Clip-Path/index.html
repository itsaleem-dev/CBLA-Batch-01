<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Path</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Clip Path</h1>
        <p class="lead">clip-path cuts an element into a shape: circle, ellipse, polygon and inset. Hover the last shape.</p>
    </header>
    <main>
        <div class="shapes">
            <div class="s circle">circle</div>
            <div class="s ellipse">ellipse</div>
            <div class="s triangle">triangle</div>
            <div class="s hexagon">hexagon</div>
            <div class="s star">star</div>
            <div class="s arrow">arrow</div>
            <div class="s inset">inset</div>
            <div class="s reveal">hover me</div>
        </div>
    </main>
</body>
</html>
