<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Gradient</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Radial Gradient</h1>
        <p class="lead">radial-gradient() with shapes, positions, sizes and repeating rings.</p>
    </header>
    <main>
        <div class="grid">
            <div class="g r1">circle</div>
            <div class="g r2">ellipse at top left</div>
            <div class="g r3">circle at 70% 30%</div>
            <div class="g r4">closest-side</div>
            <div class="g r5">repeating rings</div>
        </div>
    </main>
</body>
</html>
