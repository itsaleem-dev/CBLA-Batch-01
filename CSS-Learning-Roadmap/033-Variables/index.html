<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Variables</h1>
        <p class="lead">CSS variables store reusable values. Change the variable in :root and every use updates.</p>
    </header>
    <main>
        <div class="panel">
            <h2>Themed panel</h2>
            <p>Every color, radius and spacing here comes from a variable.</p>
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-accent">Accent</button>
        </div>
    </main>
</body>
</html>
