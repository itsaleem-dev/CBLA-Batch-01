<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Index</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Z Index</h1>
        <p class="lead">z-index controls which positioned element appears on top. Blue (3) is above green (2), which is above red (1).</p>
    </header>
    <main>
        <div class="stack">
            <div class="layer l1">z-index: 1</div>
            <div class="layer l2">z-index: 3</div>
            <div class="layer l3">z-index: 2</div>
        </div>
    </main>
</body>
</html>
