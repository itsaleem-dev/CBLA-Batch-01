<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Syntax</h1>
        <p class="lead">A CSS rule is made of a selector, a declaration block, properties and values.</p>
    </header>
    <main>
        <h2 class="demo">This heading is styled by the rule below</h2>
        <p><code class="rule">.demo { color: crimson; font-size: 2rem; text-decoration: underline; }</code></p>
        <ul class="parts">
            <li><strong>Selector:</strong> .demo</li>
            <li><strong>Property:</strong> color</li>
            <li><strong>Value:</strong> crimson</li>
        </ul>
    </main>
</body>
</html>
