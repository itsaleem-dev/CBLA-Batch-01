<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Colors</h1>
        <p class="lead">Colors can be written as names, hex codes, rgb(), rgba() and hsl().</p>
    </header>
    <main>
        <div class="swatches">
            <div class="sw named">Name: tomato</div>
            <div class="sw hex">Hex: #10b981</div>
            <div class="sw rgb">rgb(59, 130, 246)</div>
            <div class="sw rgba">rgba(139, 92, 246, 0.5)</div>
            <div class="sw hsl">hsl(45, 95%, 55%)</div>
        </div>
    </main>
</body>
</html>
