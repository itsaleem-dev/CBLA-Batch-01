<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Max</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Min Max</h1>
        <p class="lead">min(), max() and clamp() choose sizes that stay within limits.</p>
    </header>
    <main>
        <div class="box b1">width: min(90%, 400px)</div>
        <div class="box b2">width: max(50%, 250px)</div>
        <div class="box b3">width: clamp(200px, 50%, 500px)</div>
        <p class="fluid">font-size: clamp(1rem, 4vw, 2.5rem)</p>
        <div class="box b4">min-width: 150px; max-width: 300px</div>
    </main>
</body>
</html>
