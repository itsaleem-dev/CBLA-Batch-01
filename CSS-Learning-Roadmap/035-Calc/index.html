<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Calc</h1>
        <p class="lead">calc() mixes different units, such as percentages and pixels, in one value.</p>
    </header>
    <main>
        <div class="row">
            <div class="side">Fixed 200px</div>
            <div class="main">calc(100% - 200px - 1rem)</div>
        </div>
        <div class="half">width: calc(50% - 20px)</div>
        <div class="pad">padding: calc(1rem + 2vw)</div>
    </main>
</body>
</html>
